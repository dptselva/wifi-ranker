; [GENERAL] 設定例（利用環境に合わせて下の実設定を変更してください）
; wifi_interface = Wi-Fi          ; Windowsで表示される無線LANインターフェース名（例: Wi-Fi、Wi-Fi 2）
; connect_timeout = 20            ; Wi-Fi接続を待つ秒数（正の整数）
; test_timeout = 15               ; 速度測定時の通信タイムアウト秒数（正の整数）
; optimization_mode = download_heavy ; 評価方式: download_heavy / upload_heavy / balanced
; auto_switch = true              ; true: 最速Wi-Fiへ自動切替、false: 切替前に確認
; thread_count = 2                ; 速度測定に使うスレッド数（正の整数。大きいほど負荷が増えます）

[GENERAL]
wifi_interface = Wi-Fi
connect_timeout = 20
test_timeout = 15
optimization_mode = download_heavy
auto_switch = false
thread_count = 2


; [WIFI] 設定例
; discovery_mode = true           ; true: 保存済みかつ検出可能なWi-Fiを自動検索、false: target_networksを使用
; target_networks = Office-WiFi,Guest-WiFi, DP-1, DP-2 ; discovery_mode=false時の対象SSID（カンマ区切り）
; target_prefix = ABC-,CORP,dp-        ; 自動検索時に対象とするSSIDの先頭。空欄なら接頭辞で絞り込まない

[WIFI]
discovery_mode = 1
target_networks = 
target_prefix = 